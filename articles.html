<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browse the Zoho Mail Helpdesk guide library by topic or search for an answer."><title>All Help Guides | Zoho Mail Helpdesk</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div><script src="config.js"></script><script src="app.js"></script><script>
const params=new URLSearchParams(location.search);let selected=params.get("category")||"All guides";const app=document.getElementById("app");
app.innerHTML=header("All Guides")+`<section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="index.html">Home</a>　/　Help library</div><h1>Explore the help library</h1><p>Search all guides or choose a topic to narrow your results.</p></div></section><main class="container library-layout"><aside class="sidebar"><h3>Browse categories</h3><div id="sideCats"></div></aside><section><div class="library-toolbar"><input class="library-search" id="librarySearch" type="search" placeholder="Search all help guides..." aria-label="Search all guides"><span class="filter-label" id="resultCount"></span></div><div class="library-grid" id="libraryGrid"></div></section></main>`+footer();
const side=document.getElementById("sideCats");side.innerHTML=[{name:"All guides",icon:"✦"},...C.categories].map(c=>`<a href="#" class="side-cat ${selected===c.name?"active":""}" data-cat="${esc(c.name)}"><span>${c.icon} ${esc(c.name)}</span><span>${c.name==="All guides"?C.articles.length:C.articles.filter(a=>a.category===c.name).length}</span></a>`).join("");
const search=document.getElementById("librarySearch");search.value=params.get("q")||"";
function update(){let list=searchArticles(search.value);if(selected!=="All guides")list=list.filter(a=>a.category===selected);document.getElementById("resultCount").textContent=`${list.length} guides`;renderCards(list,document.getElementById("libraryGrid"))}
side.addEventListener("click",e=>{const a=e.target.closest("[data-cat]");if(!a)return;e.preventDefault();selected=a.dataset.cat;side.querySelectorAll(".side-cat").forEach(x=>x.classList.toggle("active",x===a));update()});
search.addEventListener("input",update);update();wireMenu();
</script></body></html>
